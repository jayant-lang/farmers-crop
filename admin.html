<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ayur Tech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .admin-header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .admin-header p {
            color: #666;
            font-size: 1.1rem;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00baf2;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1rem;
        }

        .admin-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #00baf2;
            padding-bottom: 10px;
        }

        .user-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
        }

        .user-info {
            flex: 1;
        }

        .user-email {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .user-phone {
            color: #666;
            font-size: 0.9rem;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #00baf2;
            color: white;
        }

        .btn-primary:hover {
            background: #0099cc;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #545b62;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .search-history {
            max-height: 400px;
            overflow-y: auto;
        }

        .search-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
        }

        .search-query {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .search-details {
            color: #666;
            font-size: 0.9rem;
        }

        .search-time {
            color: #999;
            font-size: 0.8rem;
        }

        .filter-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-controls select,
        .filter-controls input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .filter-controls button {
            padding: 10px 20px;
            background: #00baf2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-controls button:hover {
            background: #0099cc;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 10px;
            }

            .admin-sections {
                grid-template-columns: 1fr;
            }

            .filter-controls {
                flex-direction: column;
            }

            .user-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .user-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="logout()">Logout</button>
    
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔧 Admin Panel</h1>
            <p>Manage users and monitor crop search analytics</p>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalSearches">0</div>
                <div class="stat-label">Total Searches</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">0</div>
                <div class="stat-label">Active Users (24h)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="popularCrop">-</div>
                <div class="stat-label">Most Searched Crop</div>
            </div>
        </div>

        <div class="admin-sections">
            <div class="section-card">
                <h3 class="section-title">👥 User Management</h3>
                <div class="filter-controls">
                    <input type="text" id="userSearch" placeholder="Search users by email..." onkeyup="filterUsers()">
                    <select id="userFilter" onchange="filterUsers()">
                        <option value="all">All Users</option>
                        <option value="recent">Recent (7 days)</option>
                        <option value="active">Active Users</option>
                    </select>
                </div>
                <div class="user-list" id="userList">
                    <!-- Users will be populated here -->
                </div>
            </div>

            <div class="section-card">
                <h3 class="section-title">🔍 Search History</h3>
                <div class="filter-controls">
                    <select id="searchFilter" onchange="filterSearches()">
                        <option value="all">All Searches</option>
                        <option value="crops">Crop Searches</option>
                        <option value="diseases">Disease Searches</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                    </select>
                    <input type="text" id="searchQuery" placeholder="Search queries..." onkeyup="filterSearches()">
                </div>
                <div class="search-history" id="searchHistory">
                    <!-- Search history will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock data for demonstration
        const mockUsers = [
            { id: 1, email: 'farmer1@example.com', phone: '+91-9876543210', joinDate: '2024-01-15', lastActive: '2024-01-20', searches: 25 },
            { id: 2, email: 'farmer2@example.com', phone: '+91-9876543211', joinDate: '2024-01-10', lastActive: '2024-01-19', searches: 18 },
            { id: 3, email: 'farmer3@example.com', phone: '+91-9876543212', joinDate: '2024-01-08', lastActive: '2024-01-20', searches: 32 },
            { id: 4, email: 'farmer4@example.com', phone: '+91-9876543213', joinDate: '2024-01-12', lastActive: '2024-01-18', searches: 15 },
            { id: 5, email: 'farmer5@example.com', phone: '+91-9876543214', joinDate: '2024-01-05', lastActive: '2024-01-20', searches: 28 }
        ];

        const mockSearchHistory = [
            { id: 1, user: 'farmer1@example.com', query: 'rice diseases', type: 'disease', timestamp: '2024-01-20 10:30:00' },
            { id: 2, user: 'farmer2@example.com', query: 'wheat', type: 'crop', timestamp: '2024-01-20 09:15:00' },
            { id: 3, user: 'farmer3@example.com', query: 'blast disease', type: 'disease', timestamp: '2024-01-20 08:45:00' },
            { id: 4, user: 'farmer1@example.com', query: 'tomato', type: 'crop', timestamp: '2024-01-19 16:20:00' },
            { id: 5, user: 'farmer4@example.com', query: 'mustard cultivation', type: 'crop', timestamp: '2024-01-19 14:10:00' },
            { id: 6, user: 'farmer5@example.com', query: 'brown spot', type: 'disease', timestamp: '2024-01-19 11:30:00' },
            { id: 7, user: 'farmer2@example.com', query: 'maize', type: 'crop', timestamp: '2024-01-18 15:45:00' },
            { id: 8, user: 'farmer3@example.com', query: 'rust disease', type: 'disease', timestamp: '2024-01-18 13:20:00' }
        ];

        // Check admin authentication
        function checkAdminAuth() {
            const adminId = localStorage.getItem('adminId');
            const adminPassword = localStorage.getItem('adminPassword');
            
            if (adminId !== '144iot2425@rkgit.edu.in' || adminPassword !== '12345678') {
                alert('Access denied. Invalid admin credentials.');
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        // Initialize admin panel
        function initAdminPanel() {
            if (!checkAdminAuth()) return;

            updateStats();
            displayUsers(mockUsers);
            displaySearchHistory(mockSearchHistory);
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalUsers').textContent = mockUsers.length;
            document.getElementById('totalSearches').textContent = mockSearchHistory.length;
            document.getElementById('activeUsers').textContent = mockUsers.filter(user => 
                new Date(user.lastActive) >= new Date(Date.now() - 24 * 60 * 60 * 1000)
            ).length;

            // Find most popular crop
            const cropSearches = mockSearchHistory.filter(search => search.type === 'crop');
            const cropCounts = {};
            cropSearches.forEach(search => {
                cropCounts[search.query] = (cropCounts[search.query] || 0) + 1;
            });
            const popularCrop = Object.keys(cropCounts).reduce((a, b) => 
                cropCounts[a] > cropCounts[b] ? a : b, 'None'
            );
            document.getElementById('popularCrop').textContent = popularCrop;
        }

        // Display users
        function displayUsers(users) {
            const userList = document.getElementById('userList');
            userList.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-email">${user.email}</div>
                        <div class="user-phone">${user.phone}</div>
                        <div class="search-time">Joined: ${user.joinDate} | Searches: ${user.searches}</div>
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-primary" onclick="viewUserDetails(${user.id})">View</button>
                        <button class="btn btn-secondary" onclick="editUser(${user.id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Display search history
        function displaySearchHistory(searches) {
            const searchHistory = document.getElementById('searchHistory');
            searchHistory.innerHTML = searches.map(search => `
                <div class="search-item">
                    <div class="search-query">${search.query}</div>
                    <div class="search-details">
                        User: ${search.user} | Type: ${search.type}
                    </div>
                    <div class="search-time">${search.timestamp}</div>
                </div>
            `).join('');
        }

        // Filter users
        function filterUsers() {
            const searchTerm = document.getElementById('userSearch').value.toLowerCase();
            const filter = document.getElementById('userFilter').value;
            
            let filteredUsers = mockUsers;
            
            if (searchTerm) {
                filteredUsers = filteredUsers.filter(user => 
                    user.email.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filter === 'recent') {
                filteredUsers = filteredUsers.filter(user => 
                    new Date(user.joinDate) >= new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
                );
            } else if (filter === 'active') {
                filteredUsers = filteredUsers.filter(user => 
                    new Date(user.lastActive) >= new Date(Date.now() - 24 * 60 * 60 * 1000)
                );
            }
            
            displayUsers(filteredUsers);
        }

        // Filter searches
        function filterSearches() {
            const searchTerm = document.getElementById('searchQuery').value.toLowerCase();
            const filter = document.getElementById('searchFilter').value;
            
            let filteredSearches = mockSearchHistory;
            
            if (searchTerm) {
                filteredSearches = filteredSearches.filter(search => 
                    search.query.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filter === 'crops') {
                filteredSearches = filteredSearches.filter(search => search.type === 'crop');
            } else if (filter === 'diseases') {
                filteredSearches = filteredSearches.filter(search => search.type === 'disease');
            } else if (filter === 'today') {
                const today = new Date().toISOString().split('T')[0];
                filteredSearches = filteredSearches.filter(search => 
                    search.timestamp.startsWith(today)
                );
            } else if (filter === 'week') {
                filteredSearches = filteredSearches.filter(search => 
                    new Date(search.timestamp) >= new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
                );
            }
            
            displaySearchHistory(filteredSearches);
        }

        // User actions
        function viewUserDetails(userId) {
            const user = mockUsers.find(u => u.id === userId);
            alert(`User Details:\nEmail: ${user.email}\nPhone: ${user.phone}\nJoined: ${user.joinDate}\nLast Active: ${user.lastActive}\nTotal Searches: ${user.searches}`);
        }

        function editUser(userId) {
            const user = mockUsers.find(u => u.id === userId);
            const newEmail = prompt('Enter new email:', user.email);
            if (newEmail && newEmail !== user.email) {
                user.email = newEmail;
                displayUsers(mockUsers);
                alert('User updated successfully!');
            }
        }

        function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                const index = mockUsers.findIndex(u => u.id === userId);
                if (index > -1) {
                    mockUsers.splice(index, 1);
                    displayUsers(mockUsers);
                    updateStats();
                    alert('User deleted successfully!');
                }
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('adminId');
            localStorage.removeItem('adminPassword');
            window.location.href = 'login.html';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initAdminPanel);
    </script>
</body>
</html>
