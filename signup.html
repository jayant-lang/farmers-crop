<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign Up - Ayur Tech</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .signup-wrapper {
    display: flex;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    max-width: 900px;
    width: 100%;
    min-height: 600px;
  }

  .signup-left {
    flex: 1;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 40px;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .signup-left::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/><circle cx="10" cy="60" r="0.5" fill="white" opacity="0.1"/><circle cx="90" cy="40" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
    animation: float 20s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
  }

  .logo {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 10px;
    z-index: 1;
    position: relative;
    background: linear-gradient(45deg, #fff, #f0f0f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .logo img {
    width: 50px;
    height: 35px;
  }

  .tagline {
    font-size: 1.2rem;
    font-weight: 300;
    text-align: center;
    opacity: 0.9;
    z-index: 1;
    position: relative;
  }

  .signup-right {
    flex: 1;
    padding: 60px 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .signup-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .signup-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
  }

  .signup-subtitle {
    color: #666;
    font-size: 1rem;
    font-weight: 400;
  }

  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-input {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid #e1e5e9;
    border-radius: 12px;
    font-size: 16px;
    background: #fafbfc;
    transition: all 0.3s ease;
    outline: none;
  }

  .form-input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
  }

  .form-input:valid {
    border-color: #10b981;
  }

  .signup-button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-weight: 600;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .signup-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  .signup-button:hover::before {
    left: 100%;
  }

  .signup-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
  }

  .signup-button:active {
    transform: translateY(0);
  }

  .signup-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 30px 0;
    color: #666;
    font-size: 14px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e1e5e9;
  }

  .divider span {
    padding: 0 20px;
  }

  .login-link {
    text-align: center;
    color: #666;
    font-size: 14px;
  }

  .login-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }

  .login-link a:hover {
    color: #764ba2;
  }

  #message {
    text-align: center;
    font-weight: 500;
    min-height: 20px;
    margin-top: 15px;
    transition: all 0.3s ease;
  }

  .success {
    color: #10b981;
  }

  .error {
    color: #ef4444;
  }

  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 768px) {
    .signup-wrapper {
      flex-direction: column;
      margin: 10px;
      border-radius: 15px;
    }

    .signup-left {
      padding: 40px 30px;
      min-height: 200px;
    }

    .signup-right {
      padding: 40px 30px;
    }

    .logo {
      font-size: 2.5rem;
    }

    .tagline {
      font-size: 1rem;
    }

    .signup-title {
      font-size: 2rem;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 10px;
    }

    .signup-left,
    .signup-right {
      padding: 30px 20px;
    }

    .form-input {
      padding: 14px 16px;
      font-size: 16px;
    }

    .signup-button {
      padding: 14px;
    }
  }
</style>
</head>
<body>
  <div class="signup-wrapper">
    <!-- Left side with branding -->
    <div class="signup-left">
      <div class="logo">
        <img src="assets/logo.svg" alt="Ayur Tech Logo">
        Ayur Tech
      </div>
      <div class="tagline">Join the Future of Agriculture</div>
    </div>

    <!-- Right side with signup form -->
    <div class="signup-right">
      <div class="signup-header">
        <h1 class="signup-title">Create Account</h1>
        <p class="signup-subtitle">Start your agricultural journey with us</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <input type="email" id="email" class="form-input" placeholder="Email address" required />
        </div>
        
        <div class="form-group">
          <input type="text" id="phone" class="form-input" placeholder="Phone number (optional)" pattern="^\+?\d{10,}$" title="Enter a valid phone number" />
        </div>
        
        <div class="form-group">
          <input type="password" id="password" class="form-input" placeholder="Password (min 6 characters)" minlength="6" required />
        </div>

        <button class="signup-button" type="submit" id="signupBtn">
          <span id="btnText">Create Account</span>
          <div class="loading" id="loadingSpinner" style="display: none;"></div>
        </button>

        <div id="message"></div>

        <div class="divider">
          <span>or</span>
        </div>

        <div class="login-link">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </form>
    </div>
  </div>

<script>
  // DOM elements
  const form = document.getElementById('signupForm');
  const messageDiv = document.getElementById('message');
  const signupBtn = document.getElementById('signupBtn');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const emailInput = document.getElementById('email');
  const phoneInput = document.getElementById('phone');
  const passwordInput = document.getElementById('password');

  // Show message with animation
  function showMessage(text, type = 'error') {
    messageDiv.textContent = text;
    messageDiv.className = type;
    messageDiv.style.opacity = '0';
    messageDiv.style.transform = 'translateY(-10px)';
    
    setTimeout(() => {
      messageDiv.style.opacity = '1';
      messageDiv.style.transform = 'translateY(0)';
    }, 10);
  }

  // Show loading state
  function showLoading() {
    signupBtn.disabled = true;
    btnText.style.display = 'none';
    loadingSpinner.style.display = 'inline-block';
  }

  // Hide loading state
  function hideLoading() {
    signupBtn.disabled = false;
    btnText.style.display = 'inline';
    loadingSpinner.style.display = 'none';
  }

  // Form validation
  function validateForm() {
    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;

    if (!email && !phone) {
      showMessage('Please provide email or phone number', 'error');
      if (!email) emailInput.focus();
      else phoneInput.focus();
      return false;
    }

    if (email && !isValidEmail(email)) {
      showMessage('Please enter a valid email address', 'error');
      emailInput.focus();
      return false;
    }

    if (password.length < 6) {
      showMessage('Password must be at least 6 characters long', 'error');
      passwordInput.focus();
      return false;
    }

    return true;
  }

  // Email validation
  function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
  }

  // Input focus effects
  emailInput.addEventListener('focus', function() {
    this.parentElement.style.transform = 'scale(1.02)';
  });

  emailInput.addEventListener('blur', function() {
    this.parentElement.style.transform = 'scale(1)';
  });

  phoneInput.addEventListener('focus', function() {
    this.parentElement.style.transform = 'scale(1.02)';
  });

  phoneInput.addEventListener('blur', function() {
    this.parentElement.style.transform = 'scale(1)';
  });

  passwordInput.addEventListener('focus', function() {
    this.parentElement.style.transform = 'scale(1.02)';
  });

  passwordInput.addEventListener('blur', function() {
    this.parentElement.style.transform = 'scale(1)';
  });

  // Real-time validation
  emailInput.addEventListener('input', function() {
    if (this.value.trim() && !isValidEmail(this.value.trim())) {
      this.style.borderColor = '#ef4444';
    } else {
      this.style.borderColor = '#e1e5e9';
    }
  });

  passwordInput.addEventListener('input', function() {
    if (this.value.length > 0 && this.value.length < 6) {
      this.style.borderColor = '#ef4444';
    } else {
      this.style.borderColor = '#e1e5e9';
    }
  });

  // Form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!validateForm()) {
      return;
    }

    showLoading();
    messageDiv.textContent = '';

    const email = emailInput.value.trim();
    const phone = phoneInput.value.trim();
    const password = passwordInput.value;

    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ email, phone, password }),
      });

      const data = await res.json();
      
      if (res.ok) {
        showMessage('Account created successfully! Redirecting to homepage...', 'success');
        
        // Add success animation
        signupBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        
        // Redirect after a short delay
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 2000);
      } else {
        showMessage(data.message || 'Signup failed. Please try again.', 'error');
        // Shake animation for error
        signupBtn.style.animation = 'shake 0.5s ease-in-out';
        setTimeout(() => {
          signupBtn.style.animation = '';
        }, 500);
      }
    } catch (err) {
      console.error('Signup error:', err);
      showMessage('Network error. Please check your connection and try again.', 'error');
    } finally {
      hideLoading();
    }
  });

  // Add shake animation for errors
  const style = document.createElement('style');
  style.textContent = `
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  `;
  document.head.appendChild(style);

  // Add enter key support for form submission
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && (emailInput === document.activeElement || phoneInput === document.activeElement || passwordInput === document.activeElement)) {
      form.dispatchEvent(new Event('submit'));
    }
  });

  // Auto-focus on email input when page loads
  window.addEventListener('load', function() {
    emailInput.focus();
  });

  // Add smooth transitions for form groups
  const formGroups = document.querySelectorAll('.form-group');
  formGroups.forEach(group => {
    group.style.transition = 'transform 0.2s ease';
  });
</script>
</body>
</html>
