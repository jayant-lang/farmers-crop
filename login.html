<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - Ayur Tech</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .login-wrapper {
    display: flex;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    max-width: 900px;
    width: 100%;
    min-height: 600px;
  }

  .login-left {
    flex: 1;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 40px;
    color: white;
    position: relative;
    overflow: hidden;
  }

  .login-left::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/><circle cx="10" cy="60" r="0.5" fill="white" opacity="0.1"/><circle cx="90" cy="40" r="0.5" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
    animation: float 20s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
  }

  .logo {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 10px;
    z-index: 1;
    position: relative;
    background: linear-gradient(45deg, #fff, #f0f0f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .logo img {
    width: 50px;
    height: 35px;
  }

  .tagline {
    font-size: 1.2rem;
    font-weight: 300;
    text-align: center;
    opacity: 0.9;
    z-index: 1;
    position: relative;
  }

  .login-right {
    flex: 1;
    padding: 60px 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .login-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .login-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
  }

  .login-subtitle {
    color: #666;
    font-size: 1rem;
    font-weight: 400;
  }

  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-input {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid #e1e5e9;
    border-radius: 12px;
    font-size: 16px;
    background: #fafbfc;
    transition: all 0.3s ease;
    outline: none;
  }

  .form-input:focus {
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
  }

  .form-input:valid {
    border-color: #10b981;
  }

  .password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #666;
    font-size: 18px;
    transition: color 0.3s ease;
  }

  .password-toggle:hover {
    color: #333;
  }

  .login-button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-weight: 600;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .login-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  .login-button:hover::before {
    left: 100%;
  }

  .login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
  }

  .login-button:active {
    transform: translateY(0);
  }

  .login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 30px 0;
    color: #666;
    font-size: 14px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e1e5e9;
  }

  .divider span {
    padding: 0 20px;
  }

  .social-login {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
  }

  .social-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid #e1e5e9;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
    color: #333;
  }

  .social-btn:hover {
    border-color: #667eea;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  }

  .signup-link {
    text-align: center;
    color: #666;
    font-size: 14px;
  }

  .signup-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }

  .signup-link a:hover {
    color: #764ba2;
  }

  #message {
    text-align: center;
    font-weight: 500;
    min-height: 20px;
    margin-top: 15px;
    transition: all 0.3s ease;
  }

  .success {
    color: #10b981;
  }

  .error {
    color: #ef4444;
  }

  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .forgot-password {
    text-align: right;
    margin-top: 10px;
  }

  .forgot-password a {
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  .forgot-password a:hover {
    color: #764ba2;
  }

  @media (max-width: 768px) {
    .login-wrapper {
      flex-direction: column;
      margin: 10px;
      border-radius: 15px;
    }

    .login-left {
      padding: 40px 30px;
      min-height: 200px;
    }

    .login-right {
      padding: 40px 30px;
    }

    .logo {
      font-size: 2.5rem;
    }

    .tagline {
      font-size: 1rem;
    }

    .login-title {
      font-size: 2rem;
    }

    .social-login {
      flex-direction: column;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 10px;
    }

    .login-left,
    .login-right {
      padding: 30px 20px;
    }

    .form-input {
      padding: 14px 16px;
      font-size: 16px;
    }

    .login-button {
      padding: 14px;
    }
  }
</style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Left side with branding -->
    <div class="login-left">
      <div class="logo">
        <img src="assets/logo.svg" alt="Ayur Tech Logo">
        Ayur Tech
      </div>
      <div class="tagline">Empowering Agriculture with Technology</div>
    </div>

    <!-- Right side with login form -->
    <div class="login-right">
      <div class="login-header">
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to your account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="email" class="form-input" placeholder="Email address" required />
        </div>
        
        <div class="form-group">
          <input type="password" id="password" class="form-input" placeholder="Password" required />
          <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
        </div>

        <div class="forgot-password">
          <a href="#" onclick="forgotPassword()">Forgot password?</a>
        </div>

        <button class="login-button" type="submit" id="loginBtn">
          <span id="btnText">Log In</span>
          <div class="loading" id="loadingSpinner" style="display: none;"></div>
        </button>

        <div id="message"></div>

        <div class="divider">
          <span>or</span>
        </div>

        <div class="social-login">
          <button type="button" class="social-btn" onclick="socialLogin('google')">
            <span>🔍</span>
            <span>Google</span>
          </button>
          <button type="button" class="social-btn" onclick="socialLogin('facebook')">
            <span>📘</span>
            <span>Facebook</span>
          </button>
        </div>

        <div class="signup-link">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
        
        <div class="admin-link" style="text-align: center; margin-top: 15px;">
          <a href="#" onclick="showAdminLogin()" style="color: #666; text-decoration: none; font-size: 0.9rem;">Admin Login</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="adminModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 400px;">
      <span class="close" onclick="closeAdminLogin()">&times;</span>
      <div class="camera-container">
        <h3>🔧 Admin Login</h3>
        <form id="adminForm">
          <div class="form-group">
            <input type="email" id="adminEmail" class="form-input" placeholder="Admin Email" required />
          </div>
          
          <div class="form-group">
            <input type="password" id="adminPassword" class="form-input" placeholder="Admin Password" required />
          </div>

          <button class="login-button" type="submit" id="adminLoginBtn">
            <span id="adminBtnText">Login as Admin</span>
            <div class="loading" id="adminLoadingSpinner" style="display: none;"></div>
          </button>

          <div id="adminMessage"></div>
        </form>
      </div>
    </div>
  </div>

<script>
  // DOM elements
  const form = document.getElementById('loginForm');
  const messageDiv = document.getElementById('message');
  const loginBtn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  // Password toggle functionality
  function togglePassword() {
    const passwordField = document.getElementById('password');
    const toggleBtn = document.querySelector('.password-toggle');
    
    if (passwordField.type === 'password') {
      passwordField.type = 'text';
      toggleBtn.textContent = '🙈';
    } else {
      passwordField.type = 'password';
      toggleBtn.textContent = '👁️';
    }
  }

  // Forgot password functionality
  function forgotPassword() {
    const email = emailInput.value.trim();
    if (!email) {
      showMessage('Please enter your email address first', 'error');
      emailInput.focus();
      return;
    }
    
    showMessage('Password reset link sent to your email!', 'success');
    // TODO: Implement actual password reset functionality
  }

  // Social login functionality
  function socialLogin(provider) {
    showMessage(`Redirecting to ${provider} login...`, 'success');
    // TODO: Implement actual social login functionality
    console.log(`Social login with ${provider}`);
  }

  // Admin login functionality
  function showAdminLogin() {
    document.getElementById('adminModal').style.display = 'block';
  }

  function closeAdminLogin() {
    document.getElementById('adminModal').style.display = 'none';
  }

  // Admin form submission
  document.getElementById('adminForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const adminEmail = document.getElementById('adminEmail').value.trim();
    const adminPassword = document.getElementById('adminPassword').value.trim();
    const adminBtn = document.getElementById('adminLoginBtn');
    const adminBtnText = document.getElementById('adminBtnText');
    const adminLoadingSpinner = document.getElementById('adminLoadingSpinner');
    const adminMessage = document.getElementById('adminMessage');
    
    // Show loading state
    adminBtn.disabled = true;
    adminBtnText.style.display = 'none';
    adminLoadingSpinner.style.display = 'block';
    adminMessage.innerHTML = '';
    
    try {
      // Check admin credentials
      if (adminEmail === '144iot2425@rkgit.edu.in' && adminPassword === '12345678') {
        // Store admin credentials
        localStorage.setItem('adminId', adminEmail);
        localStorage.setItem('adminPassword', adminPassword);
        
        adminMessage.innerHTML = '<div class="message success">Admin login successful! Redirecting...</div>';
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1000);
      } else {
        adminMessage.innerHTML = '<div class="message error">Invalid admin credentials!</div>';
      }
    } catch (error) {
      adminMessage.innerHTML = '<div class="message error">Login failed. Please try again.</div>';
    } finally {
      // Hide loading state
      adminBtn.disabled = false;
      adminBtnText.style.display = 'block';
      adminLoadingSpinner.style.display = 'none';
    }
  });

  // Show message with animation
  function showMessage(text, type = 'error') {
    messageDiv.textContent = text;
    messageDiv.className = type;
    messageDiv.style.opacity = '0';
    messageDiv.style.transform = 'translateY(-10px)';
    
    setTimeout(() => {
      messageDiv.style.opacity = '1';
      messageDiv.style.transform = 'translateY(0)';
    }, 10);
  }

  // Show loading state
  function showLoading() {
    loginBtn.disabled = true;
    btnText.style.display = 'none';
    loadingSpinner.style.display = 'inline-block';
  }

  // Hide loading state
  function hideLoading() {
    loginBtn.disabled = false;
    btnText.style.display = 'inline';
    loadingSpinner.style.display = 'none';
  }

  // Form validation
  function validateForm() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email) {
      showMessage('Please enter your email address', 'error');
      emailInput.focus();
      return false;
    }

    if (!isValidEmail(email)) {
      showMessage('Please enter a valid email address', 'error');
      emailInput.focus();
      return false;
    }

    if (!password) {
      showMessage('Please enter your password', 'error');
      passwordInput.focus();
      return false;
    }

    if (password.length < 6) {
      showMessage('Password must be at least 6 characters long', 'error');
      passwordInput.focus();
      return false;
    }

    return true;
  }

  // Email validation
  function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
  }

  // Input focus effects
  emailInput.addEventListener('focus', function() {
    this.parentElement.style.transform = 'scale(1.02)';
  });

  emailInput.addEventListener('blur', function() {
    this.parentElement.style.transform = 'scale(1)';
  });

  passwordInput.addEventListener('focus', function() {
    this.parentElement.style.transform = 'scale(1.02)';
  });

  passwordInput.addEventListener('blur', function() {
    this.parentElement.style.transform = 'scale(1)';
  });

  // Real-time validation
  emailInput.addEventListener('input', function() {
    if (this.value.trim() && !isValidEmail(this.value.trim())) {
      this.style.borderColor = '#ef4444';
    } else {
      this.style.borderColor = '#e1e5e9';
    }
  });

  passwordInput.addEventListener('input', function() {
    if (this.value.length > 0 && this.value.length < 6) {
      this.style.borderColor = '#ef4444';
    } else {
      this.style.borderColor = '#e1e5e9';
    }
  });

  // Form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!validateForm()) {
      return;
    }

    showLoading();
    messageDiv.textContent = '';

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();
      
      if (res.ok && data.token) {
        showMessage('Login successful! Redirecting...', 'success');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user || {}));
        
        // Add success animation
        loginBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
        
        // Redirect after a short delay
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1500);
      } else {
        showMessage(data.message || 'Login failed. Please check your credentials.', 'error');
        // Shake animation for error
        loginBtn.style.animation = 'shake 0.5s ease-in-out';
        setTimeout(() => {
          loginBtn.style.animation = '';
        }, 500);
      }
    } catch (err) {
      console.error('Login error:', err);
      showMessage('Network error. Please check your connection and try again.', 'error');
    } finally {
      hideLoading();
    }
  });

  // Add shake animation for errors
  const style = document.createElement('style');
  style.textContent = `
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  `;
  document.head.appendChild(style);

  // Add enter key support for form submission
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && (emailInput === document.activeElement || passwordInput === document.activeElement)) {
      form.dispatchEvent(new Event('submit'));
    }
  });

  // Auto-focus on email input when page loads
  window.addEventListener('load', function() {
    emailInput.focus();
  });

  // Add smooth transitions for form groups
  const formGroups = document.querySelectorAll('.form-group');
  formGroups.forEach(group => {
    group.style.transition = 'transform 0.2s ease';
  });
</script>
</body>
</html>
